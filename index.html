<body>
<title>מסע האוצרות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;700;900&display=swap">
<style>
/* Layout: one phone column, full-height screens. Arcade brawler look: saturated blue ground, thick ink outlines, chunky yellow buttons. Single look by choice. RTL throughout. */
:root{
  --ink:#140a2e; --bg1:#2f7dff; --bg2:#0b2f9e; --panel:#122a78; --panel2:#1d3fa6; --line:#0a1a52;
  --yel:#ffd21e; --yel2:#ffa500; --red:#ff3b4e; --grn:#2ee66b; --grn2:#0fa84a; --pur:#9b4dff; --cyan:#3fd8ff; --white:#fff; --mute:#b9c8ff;
  --disp:"Rubik","Arial Hebrew",system-ui,sans-serif; --body:"Rubik","Arial Hebrew",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{direction:rtl;height:100%}
body{height:100%;margin:0;color:var(--white);font-family:var(--body);font-size:18px;line-height:1.4;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bg2);overflow-x:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:
  repeating-conic-gradient(from 0deg at 50% 38%,#ffffff0d 0 9deg,transparent 9deg 18deg),
  radial-gradient(circle at 50% 38%,var(--bg1),var(--bg2) 75%)}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:10px 22px;direction:rtl;text-align:right}
h1,h2,h3{font-family:var(--disp);font-weight:900;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:2.3rem}h2{font-size:1.75rem}h3{font-size:1.25rem}
p{margin:0}.mute{color:var(--mute);font-size:.95rem}
.ol{text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),0 5px 0 var(--ink)}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
button{font-family:var(--body);color:var(--white);direction:rtl}
button:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
/* buttons */
.btn{border:3px solid var(--ink);border-radius:16px;padding:14px 20px;font-size:1.25rem;font-weight:900;cursor:pointer;min-height:58px;color:var(--ink);
  background:linear-gradient(180deg,#ffe866,var(--yel) 45%,var(--yel2));box-shadow:inset 0 -5px 0 #d97f00,inset 0 3px 0 #fff8,0 6px 0 var(--ink);transition:transform .07s,box-shadow .07s;position:relative}
.btn:active{transform:translateY(5px);box-shadow:inset 0 -5px 0 #d97f00,inset 0 3px 0 #fff8,0 1px 0 var(--ink)}
.btn.alt{background:linear-gradient(180deg,#4d8dff,#2259e0);color:#fff;box-shadow:inset 0 -5px 0 #123a9e,inset 0 3px 0 #fff4,0 6px 0 var(--ink)}
.btn.alt:active{box-shadow:inset 0 -5px 0 #123a9e,0 1px 0 var(--ink)}
.btn.grn{background:linear-gradient(180deg,#7dffa4,var(--grn) 45%,var(--grn2));box-shadow:inset 0 -5px 0 #087a34,inset 0 3px 0 #fff8,0 6px 0 var(--ink)}
.btn.big{font-size:1.9rem;min-height:76px;border-radius:20px;letter-spacing:.02em}
.btn:disabled{filter:grayscale(.8) brightness(.8);pointer-events:none}
.btn.wide{width:100%}
.chip{border:3px solid var(--ink);background:var(--panel2);border-radius:14px;padding:8px 14px;font-size:1rem;font-weight:700;cursor:pointer;min-height:46px;box-shadow:0 4px 0 var(--ink);color:#fff}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1 1 0;min-width:0}
.card{background:var(--panel);border:3px solid var(--ink);border-radius:20px;padding:16px;min-width:0;box-shadow:0 5px 0 var(--ink)}
/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.pill{display:flex;align-items:center;gap:6px;background:#0008;border:3px solid var(--ink);border-radius:999px;padding:4px 12px 4px 6px;font-family:var(--disp);font-weight:900;font-size:1.25rem;font-variant-numeric:tabular-nums;direction:ltr}
.coin{width:28px;height:28px;border-radius:50%;flex:0 0 auto;background:radial-gradient(circle at 35% 30%,#fff7b0,var(--yel) 45%,var(--yel2));border:2.5px solid var(--ink);box-shadow:inset 0 -3px 0 #c97a00;display:inline-grid;place-items:center;color:#8a5200;font-weight:900;font-size:.85rem;vertical-align:middle}
.coin.sm{width:22px;height:22px;font-size:.65rem;border-width:2px}
.troph{width:26px;height:26px;flex:0 0 auto;display:inline-block;vertical-align:middle}
.meter{height:14px;border-radius:99px;background:#0007;border:2.5px solid var(--ink);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(180deg,#8dff6a,#22c94f);border-radius:99px;transition:width .5s}
.meter.gold i{background:linear-gradient(180deg,#ffe866,var(--yel2))}
.plus{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-weight:900;color:var(--yel);font-size:1.3rem;direction:ltr;unicode-bidi:isolate}
/* lobby */
.lobby{flex:1;display:flex;flex-direction:column;gap:12px}
.stageHero{position:relative;flex:1;min-height:250px;display:grid;place-items:center}
.stageHero .hero{width:min(58vw,250px)}
.heroName{position:absolute;top:0;inset-inline:0;text-align:center}
.side{position:absolute;top:34px;display:flex;flex-direction:column;gap:10px}
.side.r{right:0}.side.l{left:0}
.ibtn{width:74px;border:3px solid var(--ink);border-radius:16px;background:linear-gradient(180deg,#3d6fe8,#1b3fb0);box-shadow:0 5px 0 var(--ink);padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem;font-weight:700;cursor:pointer;position:relative}
.ibtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.ibtn svg{width:40px;height:40px}
.badge{position:absolute;top:-8px;left:-8px;min-width:24px;height:24px;border-radius:99px;background:var(--red);border:2.5px solid var(--ink);font-size:.8rem;font-weight:900;display:grid;place-items:center;padding:0 5px;animation:pulse 1s infinite}
.bubble{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:8px 14px;font-weight:700;font-size:1rem;box-shadow:0 4px 0 var(--ink);text-align:center}
/* hero + animation */
.hero{display:block;width:100%;height:auto;overflow:visible}
.bob{animation:bob 1.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-7px) scaleY(1.03)}}
@keyframes pulse{50%{transform:scale(1.18)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}65%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes shake{20%{transform:translateX(-8px) rotate(-2deg)}40%{transform:translateX(8px) rotate(2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fly{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-120px) scale(1.5);opacity:0}}
@keyframes fall{to{transform:translateY(115vh) rotate(600deg)}}
@keyframes rays{to{transform:rotate(360deg)}}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}.shake{animation:shake .4s}
.flyer{position:fixed;pointer-events:none;z-index:60;font-family:var(--disp);font-weight:900;font-size:2.2rem;color:var(--yel);direction:ltr;animation:fly .9s ease-out forwards}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.2s ease-in forwards}
/* lists, shop, parent (shared) */
.list{display:grid;gap:8px}.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;background:var(--panel2);border:2.5px solid var(--ink);border-radius:14px;min-width:0}
.gifts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gift{background:var(--panel);border:3px solid var(--ink);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;min-width:0;box-shadow:0 5px 0 var(--ink)}
.gift .em{font-size:3rem;line-height:1}.gift b{font-weight:700;font-size:1.05rem}
.price{display:flex;align-items:center;gap:6px;font-family:var(--disp);font-weight:900;font-size:1.3rem;color:var(--yel);direction:ltr}
.gift .meter{width:100%}.gift.can{background:linear-gradient(180deg,#2d59d6,var(--panel));border-color:var(--yel)}
.gift .btn{padding:8px 12px;font-size:1.05rem;min-height:48px;width:100%}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto;direction:ltr}
.pin button{height:62px;border-radius:16px;border:3px solid var(--ink);background:var(--panel2);font-size:1.6rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.dots{display:flex;gap:12px;justify-content:center}.dots i{width:18px;height:18px;border-radius:50%;background:#0006;border:3px solid var(--ink)}.dots i.f{background:var(--yel)}
input.f{font-family:var(--body);font-size:1.05rem;color:#fff;background:#0006;border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;width:100%;min-height:48px;user-select:text;-webkit-user-select:text}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
/* ===== arena ===== */
.arena{position:relative;display:flex;flex-direction:column;gap:8px;flex:1;height:calc(100dvh - 34px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:560px;max-height:920px;border:3px solid var(--ink);border-radius:22px;overflow:hidden;padding:10px;box-shadow:0 6px 0 var(--ink);touch-action:none}
.arena .ground{position:absolute;inset:auto 0 0 0;height:30%;z-index:0}
.arena .ground::before{content:"";position:absolute;inset:-34px 0 auto 0;height:36px;background:radial-gradient(circle at 50% 100%,currentColor 69%,transparent 71%) 0 0/72px 72px repeat-x}
.arena::before{content:"";position:absolute;z-index:0;inset:14% 0 auto 0;height:90px;background:radial-gradient(ellipse 60px 18px at 18% 30%,#fff5 98%,transparent),radial-gradient(ellipse 80px 22px at 78% 60%,#fff4 98%,transparent),radial-gradient(ellipse 44px 14px at 52% 12%,#fff3 98%,transparent)}
.arena>*,#gbody>*{position:relative;z-index:1}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hearts{display:flex;gap:2px;direction:ltr}
.x{width:44px;height:44px;border-radius:12px;border:3px solid var(--ink);background:var(--red);font-weight:900;font-size:1.2rem;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.qban{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:10px 14px;box-shadow:0 5px 0 var(--ink);text-align:center;display:grid;gap:4px}
.qban .qt{font-weight:900;font-size:1.3rem;line-height:1.25;text-wrap:balance}
.qban .expr{direction:ltr;unicode-bidi:isolate;font-weight:900;font-size:2.2rem;letter-spacing:.03em;line-height:1.1}
.qban .expr.heb{direction:rtl;font-size:1.5rem;letter-spacing:0}
.qban .passage{font-size:1rem;line-height:1.45;font-weight:500;text-align:right;max-height:118px;overflow:auto;background:#eef3ff;border-radius:10px;padding:8px 10px;touch-action:pan-y}
.qban .tag{font-size:.8rem;font-weight:700;color:#5a6bb0}
.tbar{height:10px;border-radius:99px;background:#0006;border:2.5px solid var(--ink);overflow:hidden;direction:ltr}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff6b3d,var(--yel));transform-origin:left}
.field{position:relative;flex:1;min-height:0}
.foe{position:absolute;top:26px;left:0;right:0;margin-inline:auto;width:58%;max-width:250px}
.foe.small{width:46%}
.hp{position:absolute;top:0;left:14%;right:14%;height:20px;border-radius:99px;background:#0008;border:3px solid var(--ink);overflow:hidden;direction:ltr}
.hp i{display:block;height:100%;background:linear-gradient(180deg,#ff8a8a,var(--red));transition:width .35s}
.hp b{position:absolute;inset:0;text-align:center;font-size:.8rem;line-height:14px;font-weight:900}
.me{position:absolute;bottom:0;right:4%;width:36%;max-width:170px}
.me.mid{right:0;left:0;margin-inline:auto;width:36%;max-width:170px}
.shot{position:absolute;z-index:5;pointer-events:none;width:44px;height:44px;margin:-22px 0 0 -22px}
.shot svg{animation:spin .35s linear infinite}
.boom{position:absolute;z-index:6;pointer-events:none;font-weight:900;font-size:2rem;color:var(--yel);direction:ltr;animation:fly .8s ease-out forwards}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans.one{grid-template-columns:1fr}
.abtn{border:3px solid var(--ink);border-radius:16px;background:linear-gradient(180deg,#fff,#dfe8ff);color:var(--ink);font-weight:900;font-size:1.35rem;min-height:60px;padding:8px 10px;box-shadow:inset 0 -5px 0 #b3c2ee,0 5px 0 var(--ink);cursor:pointer;line-height:1.15}
.abtn:active{transform:translateY(4px);box-shadow:inset 0 -5px 0 #b3c2ee,0 1px 0 var(--ink)}
.abtn.ok{background:linear-gradient(180deg,#9dffb8,var(--grn));box-shadow:inset 0 -5px 0 #0fa84a,0 5px 0 var(--ink)}
.abtn.no{background:linear-gradient(180deg,#ff9aa5,var(--red));color:#fff;box-shadow:inset 0 -5px 0 #b3182a,0 5px 0 var(--ink)}
.abtn:disabled{pointer-events:none}
/* targets */
.tgt{position:absolute;width:31%;max-width:124px;aspect-ratio:1;border-radius:50%;border:4px solid var(--ink);cursor:pointer;display:grid;place-items:center;color:var(--ink);font-weight:900;font-size:1.7rem;line-height:1.05;text-align:center;padding:6px;
  background:radial-gradient(circle,#fff 0 52%,var(--red) 53% 68%,#fff 69% 82%,var(--red) 83%);box-shadow:0 6px 0 var(--ink);animation:drift 3s ease-in-out infinite alternate}
.tgt span{max-width:74%;overflow-wrap:anywhere}
.tgt.no{filter:grayscale(1) brightness(.7);pointer-events:none}
.tgt.ok{animation:pop .3s reverse forwards;pointer-events:none}
@keyframes drift{from{transform:translate(-9px,-7px) rotate(-4deg)}to{transform:translate(9px,9px) rotate(4deg)}}
/* catch */
.drop{position:absolute;top:0;left:0;min-width:74px;max-width:32%;text-align:center;padding:9px 10px;border:3px solid var(--ink);border-radius:999px;background:linear-gradient(180deg,#fff,#ffe9a8);color:var(--ink);font-weight:900;font-size:1.2rem;line-height:1.05;box-shadow:0 4px 0 var(--ink);will-change:transform;pointer-events:none}
.catcher{position:absolute;bottom:0;left:0;width:30%;max-width:136px;will-change:transform;pointer-events:none}
.hint{position:absolute;top:2px;inset-inline:0;text-align:center;font-size:.85rem;font-weight:700;opacity:.85;pointer-events:none}
/* build */
.cells{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;padding:10px 4px}
.cells.ltr{direction:ltr}
.cell{min-width:52px;height:60px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:1.5rem;padding:0 8px}
.cell.fix{color:#fff}
.cell.slot{border:3px dashed #fff;background:#0005;cursor:pointer}
.cell.slot.full{border:3px solid var(--ink);background:linear-gradient(180deg,#fff,#dfe8ff);color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.cell.slot.hot{background:#ffd21e88}
.cells.wide .cell{min-width:70px;font-size:1.15rem;height:52px}
.tray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px 6px;background:#0005;border:3px solid var(--ink);border-radius:18px;min-height:86px;align-content:center}
.tile{min-width:56px;height:60px;border-radius:14px;border:3px solid var(--ink);background:linear-gradient(180deg,#ffe866,var(--yel2));color:var(--ink);font-weight:900;font-size:1.5rem;display:grid;place-items:center;padding:0 12px;box-shadow:inset 0 -4px 0 #d97f00,0 5px 0 var(--ink);cursor:grab;touch-action:none}
.tile.used{visibility:hidden}
.tile.ghost{position:fixed;z-index:70;pointer-events:none;margin:0;transform:translate(-50%,-60%) scale(1.15) rotate(-5deg);box-shadow:0 12px 0 #0006}
.tray.wide .tile{font-size:1.15rem;height:52px}
.bigem{font-size:4.2rem;line-height:1;text-align:center;filter:drop-shadow(0 5px 0 #0006)}
/* result, chest, map, heroes, road */
.rays{position:fixed;left:50%;top:42%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;background:repeating-conic-gradient(#fff3 0 12deg,transparent 12deg 24deg);animation:rays 14s linear infinite;border-radius:50%;z-index:0}
.center{position:relative;display:grid;place-items:center;text-align:center;gap:10px}
.stars3{display:flex;gap:6px;justify-content:center;direction:ltr}
.stars3 svg{width:54px;height:54px}.stars3 svg:nth-child(2){transform:translateY(-10px) scale(1.15)}
.chestBox{width:60%;max-width:230px;cursor:pointer;position:relative;z-index:1}
.chest .lid{transform-origin:20px 74px;transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
.chest.open .lid{transform:rotate(-38deg) translate(-6px,-14px)}
.loot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.lootc{background:var(--panel2);border:3px solid var(--ink);border-radius:18px;padding:12px 14px;min-width:120px;box-shadow:0 5px 0 var(--ink);display:grid;gap:4px;justify-items:center}
.mapw{border:3px solid var(--ink);border-radius:20px;padding:12px;box-shadow:0 5px 0 var(--ink);display:grid;gap:10px}
.nodes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;direction:rtl}
.node{aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);background:#0006;display:grid;place-items:center;font-weight:900;font-size:1.05rem;cursor:pointer;box-shadow:0 4px 0 var(--ink);position:relative;color:#fff;padding:0}
.node.done{background:linear-gradient(180deg,#7dffa4,var(--grn2));color:var(--ink)}
.node.cur{background:linear-gradient(180deg,#ffe866,var(--yel2));color:var(--ink);animation:pulse 1s infinite}
.node.lock{opacity:.55;pointer-events:none}
.node.bossn{border-radius:14px}
.node small{position:absolute;bottom:-15px;font-size:.6rem;letter-spacing:-1px;color:var(--yel);direction:ltr}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hcard{border:3px solid var(--ink);border-radius:20px;padding:10px;background:var(--panel);box-shadow:0 5px 0 var(--ink);display:grid;gap:4px;justify-items:center;text-align:center;cursor:pointer;position:relative}
.hcard .hero{width:72%}.hcard.sel{background:linear-gradient(180deg,#2d59d6,var(--panel));border-color:var(--yel)}
.hcard.locked .hero{filter:brightness(0) opacity(.45)}
.rar{font-size:.75rem;font-weight:900;border-radius:99px;padding:2px 10px;border:2px solid var(--ink);color:var(--ink)}
.rstep{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px;border:3px solid var(--ink);border-radius:16px;background:var(--panel2)}
.rstep.got{opacity:.55}.rstep.ready{background:linear-gradient(180deg,#3fae5f,#167a3a)}
.rstep .t{font-weight:900;direction:ltr;display:flex;align-items:center;gap:4px}

#app>*{position:relative;z-index:1}
#app>.bar{z-index:3}
/* ===== richer look: display face, gloss, scenes, effects ===== */
:root{--disp:"Fredoka","Rubik","Arial Hebrew",system-ui,sans-serif}
h1,h2,h3,.btn,.pill,.qban .qt,.abtn,.glab,.ibtn span,.intro b,.tgt,.cell,.tile{font-family:var(--disp);font-weight:700}
h1{font-size:2.6rem}
.btn::after,.chip::after,.ibtn::after,.abtn::after,.pill::after,.x::after{content:"";position:absolute;inset:3px 6px auto 6px;height:42%;border-radius:12px 12px 50% 50%/12px 12px 14px 14px;background:linear-gradient(#ffffffa0,#ffffff10);pointer-events:none}
.chip,.ibtn,.abtn,.pill,.x{position:relative}
.pill{background:linear-gradient(180deg,#24357d,#0d1a4a);box-shadow:inset 0 -3px 0 #0007,0 4px 0 var(--ink)}
.pill.bump,.bump{animation:pop .3s}
/* scene inside arena */
.arena{background:#000}
.scene{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.arena::before{z-index:0}
.intro{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle,#0000 30%,#0009);transition:opacity .35s;pointer-events:auto}
.intro b{font-size:3.4rem;color:var(--yel);text-align:center;padding:0 10px}
.intro.gone{opacity:0;pointer-events:none}
.hitf{filter:brightness(2.6) saturate(.4)}
.vig{position:absolute;inset:0;z-index:15;pointer-events:none;box-shadow:inset 0 0 70px 30px #ff1f3daa;animation:vig .5s ease-out forwards}
@keyframes vig{to{opacity:0}}
.spk{position:fixed;z-index:80;pointer-events:none;border-radius:3px;transform:translate(-50%,-50%) rotate(45deg);border:2px solid var(--ink)}
.flycoin{position:fixed;z-index:85;pointer-events:none;transform:translate(-50%,-50%)}
.hero{filter:drop-shadow(0 4px 0 #0003)}
/* targets with lit wood rim */
.tgt{background:radial-gradient(circle at 38% 30%,#fff 0 18%,#f4f4f4 19% 50%,#ff4a5c 51% 66%,#fff 67% 80%,#e0293d 81% 92%,#9b1424 93%);box-shadow:inset 0 -6px 0 #0003,0 7px 0 var(--ink)}
/* gates game */
.road{position:absolute;left:0;right:0;margin-inline:auto;bottom:-6%;width:64%;height:92%;transform:perspective(260px) rotateX(48deg);transform-origin:50% 100%;border:5px solid var(--ink);border-radius:18px 18px 0 0;overflow:hidden;
  background:linear-gradient(90deg,#d9b27a,#c4955a 50%,#a97a42)}
.road i{position:absolute;inset:-100% 46%;background:repeating-linear-gradient(180deg,#fff8 0 34px,transparent 34px 80px);animation:roadrun .55s linear infinite}
@keyframes roadrun{to{transform:translateY(80px)}}
.gates{position:absolute;top:2%;left:0;right:0;display:flex;justify-content:space-around;gap:4px;direction:rtl}
.gate{position:relative;width:31%;max-width:132px;border:0;background:none;padding:0;cursor:pointer;animation:gatein .5s cubic-bezier(.2,1.5,.4,1) both}
.gate .gsvg{display:block;width:100%;height:auto}
.gate .swirl{transform-origin:70px 80px;animation:spin 2.4s linear infinite}
.glab{position:absolute;left:8%;right:8%;top:44%;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:12px;font-size:1.35rem;line-height:1.1;padding:5px 4px;box-shadow:0 4px 0 var(--ink);overflow-wrap:anywhere}
.glab.sm{font-size:1rem}
.gate.ok{animation:gateok .6s ease-out forwards}
.gate.no{filter:grayscale(1) brightness(.6);animation:shake .4s;pointer-events:none}
.gate.out{animation:gateout .4s ease-in forwards;pointer-events:none}
@keyframes gatein{from{transform:scale(.2) translateY(60px);opacity:0}}
@keyframes gateok{40%{transform:scale(1.25);filter:brightness(1.8)}100%{transform:scale(1.6);opacity:0}}
@keyframes gateout{to{transform:scale(.3) translateY(-30px);opacity:0}}
.runner{position:absolute;bottom:0;left:0;right:0;margin-inline:auto;width:34%;max-width:160px;transition:opacity .2s}
.run{animation:runbob .32s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes runbob{from{transform:translateY(0) rotate(-3deg) scale(1,1)}to{transform:translateY(-12px) rotate(3deg) scale(.97,1.04)}}
/* lobby stage */
.stageHero{min-height:300px;overflow:hidden;overflow:clip;border-radius:20px}
html,body{overflow-x:hidden}
.beams{position:absolute;left:50%;top:-10%;width:520px;height:520px;margin-left:-260px;background:conic-gradient(from 180deg at 50% 0,#0000 0 160deg,#ffffff1c 166deg,#0000 172deg,#ffffff24 180deg,#0000 188deg,#ffffff1c 194deg,#0000 200deg);pointer-events:none}
.heroStand{position:relative;width:min(62vw,260px);margin-top:52px;display:grid;justify-items:center}
.heroStand .bob{width:100%;position:relative;z-index:2}
.pedestal{width:118%;margin-top:-34%;position:relative;z-index:1}
.playrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch}
.event{position:relative;overflow:hidden;border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:0;cursor:pointer;min-height:86px;text-align:right;color:#fff;background:#000}
.event .scene{opacity:.95}
.event .et{position:relative;z-index:1;display:grid;gap:1px;padding:8px 12px;background:linear-gradient(90deg,#0000,#0008 70%)}
.event small{font-size:.8rem;font-weight:700;color:var(--yel)}
.event b{font-family:var(--disp);font-size:1.25rem}
.playbtn{font-size:2.2rem;padding:10px 26px;min-height:86px}
/* map world cards with painted scenes */
.mapw{position:relative;overflow:hidden;background:#000!important}
.mapw .scene{opacity:.9}
.mapw>*:not(.scene){position:relative;z-index:1}
.node{background:linear-gradient(180deg,#5a6aa8,#2a3470)}
.node::after{content:"";position:absolute;inset:3px 8px auto 8px;height:38%;border-radius:50%;background:linear-gradient(#ffffff90,#ffffff00)}
/* result */
.victory{color:var(--yel);font-size:3.6rem;letter-spacing:.02em}
.defeat{color:#ff8a96;font-size:3rem}

.cell.fix{background:#0a1a52cc;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
/* ===== multiplication dojo ===== */
.dojoHead{display:flex;gap:12px;align-items:center;background:linear-gradient(160deg,#8a5a2e,#5a3418)}
.dojoHead p{font-size:.95rem}
.dbelt{width:110px;flex:0 0 auto}.beltsvg{display:block;width:100%;height:auto}
.bcard{background:linear-gradient(180deg,#2a4bb8,var(--panel));border:3px solid var(--ink);border-radius:20px;padding:12px;box-shadow:0 5px 0 var(--ink);display:grid;gap:10px}
.bcard.lock{filter:saturate(.25) brightness(.7)}
.bcard.got{background:linear-gradient(180deg,#2f8f5a,#16573a)}
.mbelt{width:78px;flex:0 0 auto}
.stns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stn{border:3px solid var(--ink);border-radius:16px;background:linear-gradient(180deg,#4d7dff,#1f45c0);box-shadow:0 4px 0 var(--ink);padding:6px 2px 4px;display:grid;justify-items:center;gap:1px;cursor:pointer;position:relative;color:#fff;min-height:84px}
.stn svg{width:34px;height:34px}
.stn span{font-family:var(--disp);font-weight:700;font-size:.82rem;line-height:1.1}
.stn small{color:var(--yel);font-size:.75rem;letter-spacing:1px;min-height:1em}
.stn.done{background:linear-gradient(180deg,#5fe08a,#16904a)}
.stn.cur{background:linear-gradient(180deg,#ffe866,var(--yel2));color:var(--ink);animation:pulse 1.2s infinite}
.stn.lock{opacity:.45;pointer-events:none}
.stn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
/* learn */
.lfield{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding-bottom:4px}
.lgroups{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;direction:rtl;align-content:end;flex:1;min-height:0}
.grp{background:#ffffffe6;border:3px solid var(--ink);border-radius:12px;padding:5px;box-shadow:0 3px 0 var(--ink)}
.gd{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;direction:ltr}
.gd i{width:13px;height:13px;border-radius:3px;background:radial-gradient(circle at 35% 30%,#fff7b0,var(--yel) 50%,var(--yel2));border:1.5px solid var(--ink);transform:rotate(45deg)}
.grp.big .gd i{width:8px;height:8px;border-width:1px;border-radius:2px}
.leq{text-align:center;display:grid;gap:2px;background:#0009;border:3px solid var(--ink);border-radius:16px;padding:6px 10px}
.leq b{font-family:var(--disp);font-size:1.9rem;color:var(--yel)}
.leq small{font-size:.95rem;font-weight:700;color:#fff;overflow-wrap:anywhere}
.nline{background:#0009;border:3px solid var(--ink);border-radius:16px;padding:4px 6px}
.nlsvg{display:block;width:100%;height:auto;direction:ltr}
.ans.three{grid-template-columns:repeat(3,1fr)}
.ttab{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:10px 14px;font-weight:700;font-size:1.05rem;direction:ltr}
.ttab b{color:#d14a00}
/* river */
.seq{display:flex;gap:6px;overflow-x:auto;direction:ltr;padding:2px;scrollbar-width:none;justify-content:flex-start}
.seq span{flex:0 0 auto;min-width:34px;padding:2px 8px;border-radius:99px;background:#e3eaff;border:2px solid var(--ink);font-weight:700;font-size:.95rem}
.seq span.cur{background:var(--yel)}
.water{position:absolute;inset:8% -10px 0 -10px;border-top:4px solid var(--ink);background:linear-gradient(180deg,#3fb8ff,#1565c0);border-radius:40% 40% 0 0/30px 30px 0 0;overflow:hidden}
.water i{position:absolute;left:-50%;width:200%;height:14px;border-radius:50%;border-top:4px solid #ffffff70;animation:wave 3s ease-in-out infinite alternate}
.water i:nth-child(1){top:18%}.water i:nth-child(2){top:46%;animation-delay:-1s}.water i:nth-child(3){top:74%;animation-delay:-2s}
@keyframes wave{to{transform:translateX(18%)}}
.stones{position:absolute;top:14%;left:0;right:0;display:flex;justify-content:space-around;direction:rtl}
.stone{width:29%;max-width:118px;aspect-ratio:1.5;border-radius:50%;border:4px solid var(--ink);background:radial-gradient(ellipse at 40% 30%,#e9edf6,#a9b3c9 55%,#6f7a94);box-shadow:0 8px 0 #0d3f80,0 8px 0 3px var(--ink);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:1.8rem;color:var(--ink);cursor:pointer;padding:0}
.stone.opt{animation:pop .4s both,float 2.2s ease-in-out .4s infinite alternate}
@keyframes float{to{transform:translateY(-6px)}}
.stone.ok{background:radial-gradient(ellipse at 40% 30%,#c9ffd9,#2ee66b 60%,#0f8a3e)}
.stone.sink{animation:sink .6s ease-in forwards;pointer-events:none}
@keyframes sink{to{transform:translateY(40px) scale(.6);opacity:0}}
.home{position:absolute;bottom:2%;left:0;right:0;display:grid;justify-items:center}
.stone.base{width:40%;max-width:150px;cursor:default}
.jumper{position:absolute;bottom:38%;width:30%;max-width:120px}
/* arrays */
.afield{display:grid;place-items:center;padding:6px}
.agrid{display:grid;gap:6px;background:#fffffff0;border:3px solid var(--ink);border-radius:18px;padding:10px 12px;box-shadow:0 5px 0 var(--ink);max-width:100%}
.arow{display:flex;gap:6px;justify-content:center;direction:ltr}
.arow i{width:24px;height:24px;border-radius:5px;transform:rotate(45deg);background:radial-gradient(circle at 35% 30%,#fff7b0,var(--yel) 50%,var(--yel2));border:2.5px solid var(--ink)}
.agrid.tight .arow{gap:3px}.agrid.tight .arow i{width:17px;height:17px;border-width:2px}
.arow.q{min-width:200px;height:30px;border:3px dashed #8a97c9;border-radius:10px;align-items:center}
.arow.q b{color:#5a6bb0;font-family:var(--disp);font-size:1.2rem}
.sboxes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl}
.sbox{background:linear-gradient(180deg,#e8b77a,#b97a3f);border:3px solid var(--ink);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:31%;box-shadow:0 4px 0 var(--ink);font-size:1.25rem;line-height:1}
/* belt ceremony */
.bigbelt{width:72%;max-width:300px}
/* parent fact grid */
.fgrid{display:grid;grid-template-columns:38px repeat(10,1fr);gap:3px;direction:ltr;font-size:.75rem;font-weight:700}
.fgrid .hd{text-align:center;color:var(--mute);align-self:center}
.fc{display:inline-grid;place-items:center;min-height:26px;border-radius:6px;background:#ffffff1a;border:1.5px solid var(--ink);color:#fff}
.fc.good{background:#22b45a}.fc.mid{background:#e0a400;color:var(--ink)}.fc.weak{background:#e0364a}
.fc.lg{width:16px;min-height:16px;vertical-align:middle;margin-inline-end:4px}
/* ===== gifted academy ===== */
.acHead{display:flex;gap:12px;align-items:center;background:linear-gradient(160deg,#4a3fb0,#1d1660)}
.acPrize{width:86px;height:86px;flex:0 0 auto;border-radius:22px;border:3px solid var(--ink);background:radial-gradient(circle at 50% 40%,#fff6a8,#ffb300);display:grid;place-items:center;box-shadow:0 5px 0 var(--ink);position:relative;overflow:hidden}
.acPrize .pem{font-size:3rem;line-height:1;filter:drop-shadow(0 3px 0 #0005)}
.acPrize:not(.won) .pem{animation:bob 1.6s ease-in-out infinite}
.acPrize.won::after{content:"✓";position:absolute;bottom:2px;left:6px;font-weight:900;color:#0a7a35;font-size:1.3rem}
.island{position:relative;overflow:hidden;border:3px solid var(--ink);border-radius:20px;padding:12px;box-shadow:0 5px 0 var(--ink);display:grid;gap:10px;background:#000}
.island .scene{opacity:.92}
.island>*:not(.scene){position:relative;z-index:1}
.isub{font-size:.85rem;font-weight:700}
.alvls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.alv{border:3px solid var(--ink);border-radius:16px;background:linear-gradient(180deg,#4d7dff,#1f45c0);box-shadow:0 4px 0 var(--ink);padding:8px 4px;display:grid;justify-items:center;gap:2px;cursor:pointer;color:#fff;min-height:64px;position:relative}
.alv b{font-family:var(--disp);font-size:1rem}.alv small{color:var(--yel);font-size:.85rem;letter-spacing:1px}
.alv.done{background:linear-gradient(180deg,#5fe08a,#16904a)}
.alv.cur{background:linear-gradient(180deg,#ffe866,var(--yel2));color:var(--ink);animation:pulse 1.2s infinite}.alv.cur small{color:#7a3f00}
.alv.lock{opacity:.5;pointer-events:none}
.alv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.finalCard{border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:0 5px 0 var(--ink);display:grid;gap:12px;background:linear-gradient(160deg,#b0328a,#4a1060)}
.finalCard.lock{filter:saturate(.3) brightness(.75)}
.fchest{width:96px;flex:0 0 auto}
/* puzzle screen */
.qprog{display:flex;gap:4px;direction:rtl}
.qprog i{flex:1;height:9px;border-radius:99px;background:#0006;border:1.5px solid var(--ink)}
.qprog i.ok{background:var(--grn)}.qprog i.no{background:var(--red)}.qprog i.now{background:var(--yel)}
.qwrap{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px 2px 8px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.qcard{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:12px 14px;box-shadow:0 5px 0 var(--ink);display:grid;gap:8px;text-align:center}
.qcard .tag{font-size:.8rem;font-weight:700;color:#5a6bb0}
.qcard .qt{font-family:var(--disp);font-weight:700;font-size:1.3rem;line-height:1.4;text-wrap:balance}
.qcard .qt b{color:#3b2bb0}
.qcard .expr{direction:ltr;unicode-bidi:isolate;font-weight:900;font-size:2rem;line-height:1.2}
.qcard .expr.heb{direction:rtl;font-size:1.35rem;font-weight:700}
.qem{font-size:2.6rem;line-height:1}
.qfig{display:grid;place-items:center}
.fig{display:block;width:100%;height:auto}
.frow{display:flex;gap:6px;justify-content:center;direction:ltr;flex-wrap:nowrap}
.fcell{width:56px;aspect-ratio:1;border:2.5px solid var(--ink);border-radius:12px;background:#f3f6ff;display:grid;place-items:center;padding:3px;flex:0 1 auto;min-width:0}
.fcell.q{background:#fff3c4;border-style:dashed;font-family:var(--disp);font-weight:700;font-size:1.8rem;color:#b06a00}
.mgrid{display:grid;gap:6px;direction:ltr}
.mgrid.n2{grid-template-columns:repeat(2,78px)}.mgrid.n3{grid-template-columns:repeat(3,72px)}
.mgrid .fcell{width:auto}
.anal{display:flex;align-items:center;gap:6px;direction:ltr;flex-wrap:nowrap}
.anal .fcell{width:58px}.anal .arw{font-size:1.4rem;transform:scaleX(-1);display:inline-block}.anal .sep{width:10px;height:50px;border-left:3px dashed #9aa6d6;margin:0 2px}
.mach{border:3px solid var(--ink);border-radius:14px;overflow:hidden;min-width:200px;direction:rtl;font-weight:900;font-size:1.3rem;background:linear-gradient(180deg,#e6ecff,#c9d5ff)}
.mrow{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid #8a97c9}
.mrow span{padding:5px 10px;direction:ltr}.mrow span+span{border-right:2px solid #8a97c9}
.mrow.hd{border-top:0;background:#3b2bb0;color:#fff;font-size:1rem}.mrow.q span:last-child{color:#d14a00;background:#fff3c4}
.scale{font-size:2rem;line-height:1.5;background:#f3f6ff;border:2.5px solid var(--ink);border-radius:14px;padding:6px 14px;direction:ltr;letter-spacing:2px}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qopts.one{grid-template-columns:1fr}.qopts.three{grid-template-columns:1fr 1fr 1fr}
.qopts.figs{grid-template-columns:repeat(4,1fr);gap:8px}
.qo{border:3px solid var(--ink);border-radius:16px;background:linear-gradient(180deg,#fff,#dfe8ff);color:var(--ink);font-family:var(--disp);font-weight:700;font-size:1.25rem;min-height:58px;padding:8px;box-shadow:inset 0 -5px 0 #b3c2ee,0 5px 0 var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;line-height:1.15}
.qo .l{position:absolute;top:4px;right:6px;font-size:.7rem;color:#7a86b8}
.qopts.figs .qo{padding:6px 4px 8px;min-height:0}
.fopt{display:block;width:100%;max-width:70px}
.qo:active{transform:translateY(4px);box-shadow:inset 0 -5px 0 #b3c2ee,0 1px 0 var(--ink)}
.qo.ok{background:linear-gradient(180deg,#9dffb8,var(--grn));box-shadow:inset 0 -5px 0 #0fa84a,0 5px 0 var(--ink)}
.qo.no{background:linear-gradient(180deg,#ff9aa5,var(--red));box-shadow:inset 0 -5px 0 #b3182a,0 5px 0 var(--ink)}
.qo:disabled{cursor:default}
.prizeBig{font-size:7rem;line-height:1;filter:drop-shadow(0 8px 0 #0006)}
.qcard>*{min-width:0}
.qfig{width:100%}
.frow{max-width:100%}
.frow .fcell{width:auto;flex:1 1 0;max-width:58px}
#qf{display:grid;gap:10px}
#qf .fb{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:12px 14px;box-shadow:0 5px 0 var(--ink);font-size:1.05rem;font-weight:500;line-height:1.45;text-align:right}
#qf .fb b{display:block;font-family:var(--disp);font-size:1.2rem;color:#d14a00;margin-bottom:2px}

  if(extra)for(var k in extra)q[k]=extra[k];return q}

 add:function(lv){var a,b;

 place:function(lv){var n=rnd(1,9)*100+rnd(1,9)*10+rnd(1,9);var pos=pick([[0,100,'מאות'],[1,10,'עשרות'],[2,1,'אחדות']]);var d=String(n)[pos[0]];var c=d*pos[1];

 word:function(lv){var nm=pick(NAMES),th=pick(THINGS),a=lv===1?rnd(5,12):rnd(15,40),b=lv===1?rnd(2,5):rnd(5,14),plus=Math.random()<.5;

  function move(e){if(!drag)return;drag.gh.style.left=e.clientX+'px';drag.gh.style.top=e.clientY+'px';

    return '<div class="rstep'+(got?' got':ready?' ready':'')+'">'+roadIcon(r)+'<div><b>'+roadTxt(r)+'</b><div class="t">'+TROPH+r[0]+'</div></div>'+(got?'<b>התקבל ✓</b>':ready&&i===ST.road?'<button class="btn" style="min-height:48px;padding:8px 16px" data-a="claim">קבל!</button>':'')+'</div>'}).join('')+'</div>'}
function claimRoad(){
  var r=ROAD[ST.road];if(!r||ST.trophies<r[0])return;ST.road++;
  if(r[1]==='c'){addCoins(r[2]);sfx('coin');persist();render();flyer('+'+r[2],$('wallet'));return}
  if(r[1]==='h'){if(grantHero(r[2])){persist();V.unlock=r[2];V.name='unlock';render();sfx('unlock');confetti(90);return}addCoins(100);persist();render();return}
  ST.chests.push(r[1]);persist();openNextChest()}

/* ===== chest ===== */
function openNextChest(){if(!ST.chests.length){V.name='lobby';return render()}V.chest={big:ST.chests[0]==='b',taps:0,loot:null};V.name='chest';render()}
function chestView(){
  var c=V.chest;
  if(!c.loot)return '<div class="center" style="flex:1;align-content:center"><div class="rays"></div><h1 class="ol" style="z-index:1">'+(c.big?'תיבת ענק!':'תיבת הפתעה!')+'</h1><button class="chestBox bob" id="cbox" data-a="chesttap" style="background:none;border:0">'+chestSvg(c.big)+'</button><div class="bubble" style="z-index:1">הקש על התיבה '+(3-c.taps)+' פעמים</div></div>';
  var l=c.loot;
  return '<div class="center" style="flex:1;align-content:center"><div class="rays"></div><div class="chestBox">'+chestSvg(c.big,true)+'</div><div class="loot" style="z-index:1"><div class="lootc pop">'+'<span class="coin" style="width:54px;height:54px;font-size:1.6rem">★</span><span class="plus" style="font-size:1.8rem">+'+l.coins+'</span></div>'+
   (l.hero?'<div class="lootc pop" style="animation-delay:.25s;background:linear-gradient(180deg,#b06bff,#5a1fc2)"><div style="width:110px">'+heroSvg(l.hero,'happy')+'</div><b class="ol">דמות חדשה: '+heroBy(l.hero).name+'</b></div>':'')+'</div>'+
   '<button class="btn wide" style="z-index:1" data-a="chestdone">'+(ST.chests.length?'לתיבה הבאה':'מעולה!')+'</button></div>'}
function chestTap(){
  var c=V.chest;if(c.loot)return;c.taps++;sfx('chest');
  if(c.taps<3){render();shakeEl($('cbox'));return}
  ST.chests.shift();c.loot=rollChest(c.big);addCoins(c.loot.coins);if(c.loot.hero)grantHero(c.loot.hero);persist();render();sfx(c.loot.hero?'unlock':'open');confetti(c.loot.hero?110:70)}
function unlockView(){var h=heroBy(V.unlock);
  return '<div class="center" style="flex:1;align-content:center"><div class="rays"></div><h1 class="ol pop" style="z-index:1">דמות חדשה!</h1><div class="bob" style="width:62%;max-width:240px;z-index:1">'+heroSvg(h,'happy')+'</div><h2 class="ol" style="z-index:1">'+h.name+'</h2><span class="rar" style="background:'+RARC[h.rar]+';z-index:1">'+RAR[h.rar]+'</span><div class="bubble" style="z-index:1">'+h.txt+'</div>'+
  '<div class="row" style="z-index:1;width:100%"><button class="btn grow" data-a="pick" data-k="'+h.id+'">לשחק איתו</button><button class="btn alt grow" data-a="lobby">אחר כך</button></div></div>'}

/* ===== stage result ===== */
function finishStage(win){
  if(G.dragOff)G.dragOff();if(G.cfg.dojo)return finishDojo(win);if(G.cfg.exam)return finishExam(win);if(G.cfg.acad)return finishAcad(win);
  var cfg=G.cfg,first=cfg.i===ST.prog,stars=win?(G.lost===0?3:G.lost===1?2:1):0,bonus=win?(cfg.boss?30:10):0,tr=win?(first?(cfg.boss?15:8):3):0,chest='';
  addCoins(bonus);ST.trophies+=tr;ST.rounds++;
  if(win){ST.wins++;ST.stars[cfg.i]=Math.max(ST.stars[cfg.i]||0,stars);if(G.lost===0)ST.perfect++;
    if(first){ST.prog++;chest=cfg.boss?'b':'s'}else if(stars===3&&Math.random()<.25)chest='s';if(chest)ST.chests.push(chest)}
  persist();V.res={win:win,stars:stars,coins:G.coins,bonus:bonus,tr:tr,chest:chest,i:cfg.i,boss:cfg.boss,fast:G.fast};V.name='result';render();
  sfx(win?'win':'lose');if(win){confetti(stars===3?100:50);[1,2,3].forEach(function(n){if(n<=stars)setTimeout(function(){sfx('star')},500+n*260)})}}
function resultView(){
  var r=V.res,st='';for(var i=1;i<=3;i++)st+='<span class="pop" style="animation-delay:'+(.4+i*.26)+'s;display:inline-block">'+star(i<=r.stars)+'</span>';
  if(!r.win)return topbar(true)+'<div class="center" style="flex:1;align-content:center"><h1 class="ol defeat pop">כמעט!</h1><div style="width:46%;max-width:180px">'+heroSvg(ST.hero,'hurt')+'</div><div class="bubble">'+(r.acad?'ענית נכון על '+r.ok+' מתוך '+r.n+'. כדי לעבור צריך '+r.need+'. ':'')+'אספת '+r.coins+' מטבעות בדרך. גיבורים אמיתיים מנסים שוב!</div>'+retryButtons(r)+'</div>';
  return topbar(true)+'<div class="center" style="flex:1;align-content:center"><div class="rays"></div><h1 class="ol pop victory" style="z-index:1">'+(r.acad?(r.final?'עברת את המבחן הגדול!':'כל הכבוד!'):r.exam?'סיימת את האימון!':r.dojo&&r.k===3?'עברת את המבחן!':r.boss?'ניצחת את הבוס!':'ניצחון!')+'</h1><div class="stars3" style="z-index:1">'+st+'</div><div class="bob" style="width:42%;max-width:170px;z-index:1">'+heroSvg(ST.hero,'happy')+'</div>'+
  '<div class="list" style="z-index:1;width:100%"><div class="li"><span>מטבעות מהתשובות'+(r.fast?' (כולל '+r.fast+' בונוסי מהירות)':'')+'</span><b class="plus"><span data-count="'+r.coins+'">+0</span> '+coinEl(true)+'</b></div><div class="li"><span>בונוס ניצחון</span><b class="plus"><span data-count="'+r.bonus+'">+0</span> '+coinEl(true)+'</b></div><div class="li"><span>גביעים</span><b class="plus"><span data-count="'+r.tr+'">+0</span> '+TROPH+'</b></div></div>'+
  resButtons(r)+'</div>'}

function runCounts(){var els=document.querySelectorAll('[data-count]');Array.prototype.forEach.call(els,function(e,i){var to=+e.getAttribute('data-count'),t0=null,delay=900+i*450;
  setTimeout(function(){function step(t){if(!t0)t0=t;var k=Math.min(1,(t-t0)/650);e.textContent='+'+Math.round(to*k);if(k<1)requestAnimationFrame(step);else{e.closest('.li')&&e.closest('.li').classList.add('bump')}}if(to>0){sfx('coin');requestAnimationFrame(step)}},delay)})}
/* ===== shop ===== */
function shopView(){
  var gs=ST.gifts.slice().sort(function(a,b){return a.price-b.price});
  return topbar(true)+'<h2 class="ol">חנות המתנות</h2><p class="mute">אוספים מטבעות במשחקים, ובוחרים מתנה. הקנייה מאושרת על ידי אבא או אמא.</p>'+
  '<div class="gifts">'+gs.map(function(g){var can=ST.coins>=g.price,pct=Math.min(100,Math.round(ST.coins/g.price*100));
    return '<div class="gift'+(can?' can':'')+'"><div class="em">'+esc(g.em)+'</div><b>'+esc(g.name)+'</b><div class="price">'+coinEl(true)+fmt(g.price)+'</div><div class="meter gold"><i style="width:'+pct+'%"></i></div>'+
    (can?'<button class="btn" data-a="buy" data-k="'+g.id+'">אני רוצה!</button>':'<span class="mute">חסרים '+fmt(g.price-ST.coins)+'</span>')+'</div>'}).join('')+'</div>'+
  (gs.length?'':'<div class="card">עדיין אין מתנות בחנות. אבא או אמא יכולים להוסיף באזור ההורים.</div>')}
function pinPad(){
  var d='';for(var i=0;i<4;i++)d+='<i class="'+(i<V.pin.length?'f':'')+'"></i>';
  var keys='';[1,2,3,4,5,6,7,8,9].forEach(function(n){keys+='<button data-a="pin" data-k="'+n+'">'+n+'</button>'});
  keys+='<button data-a="pinx" aria-label="מחיקה">⌫</button><button data-a="pin" data-k="0">0</button><span></span>';
  return '<div class="dots" aria-label="קוד">'+d+'</div><div class="pin">'+keys+'</div>'}
function buyView(){
  var g=ST.gifts.filter(function(x){return x.id===V.gift})[0];if(!g){V.name='shop';return shopView()}
  return topbar(true)+'<div class="card" style="text-align:center;display:grid;gap:14px"><div style="font-size:4rem">'+esc(g.em)+'</div><h2 class="ol">'+esc(g.name)+'</h2><div class="price" style="justify-content:center;font-size:1.6rem">'+coinEl()+fmt(g.price)+'</div>'+
  '<p>כדי לקנות, אבא או אמא מקלידים את הקוד שלהם.</p>'+(V.msg?'<p style="color:#ffb3bb">'+V.msg+'</p>':'')+pinPad()+'</div>'}
function boughtView(){
  var g=V.bought;return '<div class="card pop" style="text-align:center;display:grid;gap:14px;margin-top:20px"><div class="bob" style="width:150px;margin:0 auto">'+heroSvg(ST.hero,'happy')+'</div><h1 class="ol">המתנה שלך!</h1><div style="font-size:4rem">'+esc(g.em)+'</div><h2 class="ol">'+esc(g.name)+'</h2>'+
  '<p>הראה את המסך לאבא או לאמא, והם יסדרו לך את המתנה. כל הכבוד על כל התרגילים!</p><button class="btn wide" data-a="lobby">חוזרים למסע</button></div>'}

/* ===== parent area ===== */
function parentGate(){return topbar(true)+'<div class="card" style="display:grid;gap:14px;text-align:center"><h2 class="ol">אזור הורים</h2><p>הקלידו את הקוד בן 4 הספרות.</p>'+(V.msg?'<p style="color:#ffb3bb">'+V.msg+'</p>':'')+pinPad()+'<p class="mute">קוד ברירת המחדל הוא 1234. מומלץ להחליף אותו.</p></div>'}
function parentView(){
  var hist=ST.history.slice(-8).reverse();
  return topbar(true)+'<h2 class="ol">אזור הורים</h2>'+
  '<div class="card list"><h3>התקדמות</h3>'+
   '<div class="li"><span>מטבעות בארנק</span><b>'+fmt(ST.coins)+'</b></div><div class="li"><span>סך הכול נאספו</span><b>'+fmt(ST.earned)+'</b></div>'+
   '<div class="li"><span>שלבים שהושלמו במפה</span><b>'+ST.prog+' מתוך '+NSTAGE+'</b></div><div class="li"><span>משחקים ששוחקו / ללא טעות</span><b>'+ST.rounds+' / '+ST.perfect+'</b></div><div class="li"><span>אימוני שלב א׳</span><b>'+(ST.exams||0)+'</b></div><div class="li"><span>גביעים</span><b>'+ST.trophies+'</b></div><div class="li"><span>דמויות שנאספו</span><b>'+ST.heroes.length+' מתוך '+HEROES.length+'</b></div>'+
   '<div class="li"><span>שלב חשבון / עברית</span><b>'+ST.lvM+' / '+ST.lvH+'</b></div><div class="li"><span>רצף ימים</span><b>'+ST.streakDays+'</b></div></div>'+
  acadParent()+'<div class="card list"><h3>לוח הכפל</h3><p class="mute">חגורה: '+(ST.belt?BELTS[ST.belt-1].name:'לבנה')+'. כל משבצת היא תרגיל, והצבע מראה כמה הוא שולט בו.</p>'+factGrid()+'</div>'+
  '<div class="card list"><h3>התאמת מטבעות</h3><p class="mute">להוספה או הורדה ידנית, למשל על מטלה בבית.</p><div class="row"><button class="chip grow" data-a="adj" data-k="-50">−50</button><button class="chip grow" data-a="adj" data-k="50">+50</button><button class="chip grow" data-a="adj" data-k="100">+100</button><button class="chip grow" data-a="adj" data-k="250">+250</button></div></div>'+
  '<div class="card list"><h3>מתנות ומחירים</h3><p class="mute">המחיר במטבעות. כל שלב מביא בערך 40 עד 90 מטבעות, כולל התיבות.</p>'+
   ST.gifts.map(function(g){return '<div class="li" style="display:grid;grid-template-columns:56px 1fr;gap:8px"><input class="f" data-f="em" data-id="'+g.id+'" value="'+esc(g.em)+'" maxlength="4" aria-label="אייקון" style="text-align:center;font-size:1.5rem"><input class="f" data-f="name" data-id="'+g.id+'" value="'+esc(g.name)+'" maxlength="40" aria-label="שם המתנה">'+
    '<span class="mute" style="align-self:center">מחיר</span><div class="row" style="flex-wrap:nowrap"><input class="f" type="number" inputmode="numeric" min="1" data-f="price" data-id="'+g.id+'" value="'+g.price+'" aria-label="מחיר" style="direction:ltr"><button class="chip" data-a="delgift" data-k="'+g.id+'" aria-label="מחיקה">מחק</button></div></div>'}).join('')+
   '<button class="btn alt wide" data-a="addgift">הוספת מתנה</button></div>'+
  '<div class="card list"><h3>רכישות אחרונות</h3>'+(hist.length?hist.map(function(h){var d=new Date(h.t);return '<div class="li"><span>'+esc(h.em)+' '+esc(h.g)+'</span><span class="mute">'+d.getDate()+'.'+(d.getMonth()+1)+' · '+fmt(h.p)+'</span></div>'}).join(''):'<p class="mute">עדיין לא נקנו מתנות.</p>')+'</div>'+
  '<div class="card list"><h3>אבטחה ואיפוס</h3><label class="mute" for="newpin">קוד חדש (4 ספרות)</label><div class="row" style="flex-wrap:nowrap"><input class="f" id="newpin" type="tel" inputmode="numeric" maxlength="4" style="direction:ltr"><button class="chip" data-a="setpin">שמירה</button></div>'+
   (V.resetArm?'<p style="color:#ffb3bb">בטוח? כל המטבעות וההתקדמות יימחקו.</p><div class="row"><button class="btn wide" style="background:var(--red);color:#fff" data-a="reset2">כן, לאפס הכול</button><button class="chip" data-a="reset0">ביטול</button></div>':'<button class="chip" data-a="reset1">איפוס התקדמות</button>')+'</div>'}
/* ===== router ===== */
var lastName='';
function render(){
  var n=V.name,h='';
  if(n==='lobby')h=lobbyView();else if(n==='game')h=gameView();else if(n==='result')h=resultView();else if(n==='map')h=mapView();else if(n==='heroes')h=heroesView();else if(n==='road')h=roadView();
  else if(n==='chest')h=chestView();else if(n==='unlock')h=unlockView();else if(n==='shop')h=shopView();else if(n==='buy')h=buyView();else if(n==='bought')h=boughtView();else if(n==='gate')h=parentGate();else if(n==='parentp')h=parentView();else if(n==='dojo')h=dojoView();else if(n==='belt')h=beltView();else if(n==='acad')h=acadView();else if(n==='prize')h=prizeView();
  $app.innerHTML=h;if(n!==lastName){window.scrollTo(0,0);lastName=n}
  if(n==='game'){GAMES[G.cfg.type]();runIntro()}
  if(n==='result')runCounts();
  if(n==='belt'){sfx('unlock');confetti(120)}}
function leaveGame(){if(G){G.live=false;G.timers.forEach(clearTimeout);if(G.dragOff)G.dragOff();persist()}}
function go(n){V.name=n;V.pin='';V.msg='';V.resetArm=false;if(n==='lobby')V.parent=false;render()}
function pinDigit(k){
  if(V.pin.length>=4)return;V.pin+=k;V.msg='';
  if(V.pin.length<4){render();return}
  if(V.pin===ST.pin){
    if(V.name==='gate'){V.parent=true;V.pin='';V.name='parentp';render();return}
    var g=ST.gifts.filter(function(x){return x.id===V.gift})[0];
    if(g&&ST.coins>=g.price){ST.coins-=g.price;ST.history.push({t:Date.now(),g:g.name,em:g.em,p:g.price});persist();V.bought=g;V.name='bought';V.pin='';render();sfx('unlock');confetti(100);return}
    V.msg='אין מספיק מטבעות';V.pin='';render();return}
  V.pin='';V.msg='הקוד לא נכון. נסו שוב.';sfx('bad');render()}
$app.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;var a=el.getAttribute('data-a'),k=el.getAttribute('data-k');
  if(a==='ans'){if(G&&G.live&&G.onAns)G.onAns(+k,el);return}
  sfx('tap');
  if(a==='lobby')return go('lobby');
  if(a==='quit'){leaveGame();return go('lobby')}
  if(a==='snd'){ST.snd=!ST.snd;persist();musicSync();return render()}
  if(a==='mus'){ST.mus=!ST.mus;persist();musicSync();return render()}
  if(a==='play'){var ns=nextStage();return startStage(ns>=0?ns:rnd(0,NSTAGE-1))}
  if(a==='stage'){if(+k<=ST.prog)startStage(+k);return}
  if(a==='map'||a==='heroes'||a==='road'||a==='shop'||a==='dojo')return go(a);
  if(a==='dstation'){var bk=k.split('-');return startDojo(+bk[0],+bk[1])}
  if(a==='belt'){V.name='belt';return render()}
  if(a==='exam')return startExam();
  if(a==='acad')return go('acad');
  if(a==='aplay'){var ak=k.split('-');return startAcad(+ak[0],+ak[1])}
  if(a==='afinal')return startFinal();
  if(a==='prize'){V.popen=false;V.ptaps=0;V.name='prize';return render()}
  if(a==='ptap')return prizeTap();
  if(a==='chest'||a==='chestdone')return openNextChest();
  if(a==='chesttap')return chestTap();
  if(a==='claim')return claimRoad();
  if(a==='pick'){if(ST.heroes.indexOf(k)>=0){ST.hero=k;persist();sfx('star');if(V.name==='unlock')return go('lobby');render()}return}
  if(a==='buy'){V.gift=k;V.pin='';V.msg='';V.name='buy';return render()}
  if(a==='parent'){V.pin='';V.msg='';V.name=V.parent?'parentp':'gate';return render()}
  if(a==='pin')return pinDigit(k);
  if(a==='pinx'){V.pin=V.pin.slice(0,-1);return render()}
  if(a==='adj'){ST.coins=Math.max(0,ST.coins+(+k));persist();return render()}
  if(a==='addgift'){ST.gifts.push({id:'g'+Date.now(),em:'🎁',name:'מתנה חדשה',price:300});persist();return render()}
  if(a==='delgift'){ST.gifts=ST.gifts.filter(function(g){return g.id!==k});persist();return render()}
  if(a==='setpin'){var v=document.getElementById('newpin').value.trim();if(/^\d{4}$/.test(v)){ST.pin=v;persist();flyer('נשמר',el)}else flyer('4 ספרות',el,'#ff3b4e');return}
  if(a==='reset1'){V.resetArm=true;return render()}
  if(a==='reset0'){V.resetArm=false;return render()}
  if(a==='reset2'){var pin=ST.pin,gf=ST.gifts,hs=ST.history,ap=ST.acadPrize;ST=freshState();ST.pin=pin;ST.gifts=gf;ST.history=hs;if(ap)ST.acadPrize=ap;persist();V.resetArm=false;return render()}
});
$app.addEventListener('change',function(e){
  var el=e.target;if(el.getAttribute&&el.getAttribute('data-pf')){var P=Object.assign({},aPrize());P[el.getAttribute('data-pf')]=el.value.trim()||(el.getAttribute('data-pf')==='em'?'🎁':'הפרס הגדול');ST.acadPrize=P;persist();return}
  if(!el.getAttribute||!el.getAttribute('data-f'))return;
  var g=ST.gifts.filter(function(x){return x.id===el.getAttribute('data-id')})[0];if(!g)return;var f=el.getAttribute('data-f');
  if(f==='price'){var p=parseInt(el.value,10);if(!(p>=1))p=g.price;g.price=p;el.value=p}
  else if(f==='em')g.em=el.value.trim()||'🎁';else g.name=el.value.trim()||'מתנה';
  persist()});
/* ===== boot ===== */
lsLoad();
var bonus=dailyCheck();
if(bonus)V.msg='בונוס יומי: <span class="plus" style="color:#d97f00">+'+bonus+'</span> מטבעות! יום '+ST.streakDays+' ברצף.';
render();dbInit();
</script>
